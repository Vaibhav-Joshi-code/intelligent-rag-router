name: chaitech-rag-strategies

services:
  app:
    build: .
    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/strategies.db
      LOG_FILE: /app/logs/server.log
      LOG_LEVEL: INFO

    ports:
      - "127.0.0.1:8002:8000"

    volumes:
      - state:/data
      - ./logs:/app/logs

    read_only: true

    tmpfs:
      - /tmp:size=64m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  state: